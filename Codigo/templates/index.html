<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card Dealer</title>
  <style>
    .page-title {
      font-size: 3rem;
      text-align: center;
      margin: 1rem 0;
      font-family: sans-serif;
    }
    .error {
      color: red;
      text-align: center;
      margin: 0.5rem 0;
    }
    form {
      text-align: center;
      margin-bottom: 1rem;
    }
    label {
      margin: 0 0.5rem;
    }
    .card-img {
      width: 80px;
      height: auto;
      margin: 4px;
    }
    #deck-display, #player-hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1 class="page-title">Card Dealer</h1>

  {% if error_message %}
    <div class="error">{{ error_message }}</div>
  {% endif %}

  <form method="post">
    <label>
      Deck:
      <select name="deck" id="deck">
        {% for name in decks.keys() %}
          <option value="{{ name }}"
            {% if name == selected_deck %}selected{% endif %}>
            {{ name }}
          </option>
        {% endfor %}
      </select>
    </label>

    <label>
      Players:
      <input type="number" name="players" min="1" value="{{ num_players }}">
    </label>

    <label>
      Cards per Player:
      <input type="number" name="cards_per" min="1" value="{{ cards_per_player }}">
    </label>

    <button type="submit">Deal</button>
  </form>

  <h2 id="deck-header">
    {{ selected_deck }} ({{ decks[selected_deck] }} cards)
  </h2>
  <div id="deck-display">
    {% for i in range(1, decks[selected_deck] + 1) %}
      <img
        src="{{ url_for('static',
                filename='Cartas/' ~ selected_deck ~ '/' ~ i ~ '.png') }}"
        alt="Card {{ i }}"
        class="card-img">
    {% endfor %}
  </div>

  {% if hands %}
    <input type="hidden" id="hands-data" value='{{ hands|tojson|safe }}'>

    <h2>Select a Player</h2>
    <div id="player-buttons">
      {% for i in range(hands|length) %}
        <button type="button" class="player-btn" data-player="{{ i }}">
          Player {{ i + 1 }}
        </button>
      {% endfor %}
    </div>

    <div id="player-hand"></div>
  {% endif %}

  <script>
    const decksData   = {{ decks|tojson|safe }};
    const deckSelect  = document.getElementById('deck');
    const deckHeader  = document.getElementById('deck-header');
    const deckDisplay = document.getElementById('deck-display');

    deckSelect.addEventListener('change', () => {
      const name  = deckSelect.value;
      const total = decksData[name];

      deckHeader.textContent = `${name} (${total} cards)`;
      deckDisplay.innerHTML = '';
      for (let i = 1; i <= total; i++) {
        const img = document.createElement('img');
        img.src       = `/static/Cartas/${name}/${i}.png`;
        img.alt       = `Card ${i}`;
        img.className = 'card-img';
        deckDisplay.appendChild(img);
      }
    });

    {% if hands %}
    const handBtns   = document.querySelectorAll('.player-btn');
    const handsData  = JSON.parse(
      document.getElementById('hands-data').value
    );
    const playerHand = document.getElementById('player-hand');

    handBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.player, 10);
        playerHand.innerHTML = '';
        handsData[idx].forEach(cardNum => {
          const img = document.createElement('img');
          img.src       = `/static/Cartas/${deckSelect.value}/${cardNum}.png`;
          img.alt       = `Card ${cardNum}`;
          img.className = 'card-img';
          playerHand.appendChild(img);
        });
      });
    });
    {% endif %}
  </script>
</body>
</html>
